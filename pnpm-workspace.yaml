packages:
  - apps/*
  - '!apps/pos-desktop'
  - '!apps/kitchen-desktop'
  - services/*
  - packages/*

strictPeerDependencies: true
saveExact: true
blockExoticSubdeps: true

overrides:
  # Nest's upload dependency: upstream security fixes, without changing its API.
  'multer@2.2.0': 2.3.0
  # GHSA-qhr7-859c-m2p7 / GHSA-6j4f-fj2g-mc7p: bounded brace nesting.
  'brace-expansion@5.0.9': 5.0.11
  # GHSA-68fv-2mgg-jv7q: validate indexed source-map section offsets.
  'source-map-js@1.2.1': 1.2.2
  # GHSA-jqcg-44mw-7w3h: constrain IPv4-mapped IPv6 trusted subnets.
  'proxy-addr@2.0.7': 2.0.8
  # GHSA-vc2v-76pw-4v95: destroy compression streams on premature close.
  'compression@1.8.1': 1.8.2

patchedDependencies:
  node-forge@1.4.0: patches/node-forge@1.4.0.patch
  braces@3.0.3: patches/braces@3.0.3.patch
