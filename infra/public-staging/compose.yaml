name: pickchick-public

services:
  gateway:
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    container_name: pickchick-public-gateway
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    # The pinned upstream binary has this file capability; retaining its bounding
    # bit is required to exec it under no-new-privileges, even on port 8080.
    cap_add: [NET_BIND_SERVICE]
    security_opt: ['no-new-privileges:true']
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.5
    tmpfs: ['/tmp:size=16m,mode=1777', '/config:size=4m,mode=0700', '/data:size=4m,mode=0700']
    command: ['caddy', 'run', '--config', '/etc/caddy/Caddyfile', '--adapter', 'caddyfile']
    volumes: ['./gateway.Caddyfile:/etc/caddy/Caddyfile:ro']
    # No published ports, Docker socket, database network, or application secrets.
    networks: [front, api_ingress]
    logging:
      driver: json-file
      options: { max-size: '5m', max-file: '2' }
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/health/live']
      interval: 10s
      timeout: 3s
      retries: 6

networks:
  front:
    external: true
    name: deploy_default
  api_ingress:
    external: true
    name: pickchick-staging_ingress
