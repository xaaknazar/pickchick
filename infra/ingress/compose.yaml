name: pickchick-ingress
services:
  caddy:
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    pull_policy: never
    container_name: pickchick-ingress
    user: '${INGRESS_UID:?}:${INGRESS_GID:?}'
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    mem_limit: 192m
    pids_limit: 128
    ports:
      - '80:80/tcp'
      - '443:443/tcp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data:/data
      - ./config:/config
    tmpfs: [/tmp]
    networks:
      ingress:
        ipv4_address: 10.240.17.2
networks:
  ingress:
    name: pickchick-public-ingress
    external: true
