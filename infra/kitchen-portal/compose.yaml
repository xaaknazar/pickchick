name: pickchick-kitchen-portal
services:
  portal:
    image: node:24.16.0-bookworm-slim@sha256:2c87ef9bd3c6a3bd4b472b4bec2ce9d16354b0c574f736c476489d09f560a203
    container_name: pickchick-kitchen-portal
    user: '1000:1000'
    working_dir: /app
    command: ['node', 'infra/kitchen-portal/server.mjs', '/run/secrets/config.json']
    environment:
      PICKCHICK_KITCHEN_SOURCE_SHA: '${KITCHEN_SOURCE_SHA:-}'
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5
    tmpfs: ['/tmp:size=8m,mode=1777']
    volumes:
      - '${KITCHEN_RELEASE:?Required}:/app:ro'
      - '${KITCHEN_STATE:?Required}/private/config.json:/run/secrets/config.json:ro'
    networks: [kitchen_ingress]
    logging:
      driver: json-file
      options: { max-size: '5m', max-file: '2' }
    healthcheck:
      test: ['CMD', 'node', 'infra/kitchen-portal/healthcheck.mjs', '/run/secrets/config.json']
      interval: 5s
      timeout: 3s
      retries: 12
networks:
  kitchen_ingress:
    name: pickchick-kitchen_ingress
    internal: true
