<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>PickChick</title>
    <link rel="stylesheet" href="/v2/customer.css" />
    <script type="module" src="/v2/customer.js"></script>
  </head>
  <body>
    <main id="screen" class="screen idle" aria-live="polite">
      <section class="welcome" data-part="idle">
        <img class="welcome-logo" src="/v2/assets/logo-sticker.webp" alt="PickChick" />
        <h1>Добро пожаловать!</h1>
        <p class="kz">Қош келдіңіз!</p>
      </section>
      <section class="order" data-part="order">
        <div class="list">
          <header class="list-head">
            <div>
              <h2>Ваш заказ</h2>
              <p class="kz">Сіздің тапсырысыңыз</p>
            </div>
            <span class="mode" id="mode"></span>
          </header>
          <ol class="lines" id="lines"></ol>
        </div>
        <aside class="side">
          <img class="side-logo" src="/v2/assets/logo-sticker.webp" alt="PickChick" />
          <div class="sum">
            <p class="sum-title" id="sum-title">Итого</p>
            <p class="kz sum-kz" id="sum-kz">Барлығы</p>
            <p class="sum-value" id="total"></p>
            <p class="sum-count" id="count"></p>
          </div>
          <div class="pay" id="pay"></div>
        </aside>
      </section>
      <section class="done" data-part="done">
        <p class="done-thanks">Спасибо!</p>
        <p class="kz done-thanks-kz">Рахмет!</p>
        <div class="done-card">
          <p class="done-label">Номер вашего заказа</p>
          <p class="kz done-label-kz">Тапсырыс нөмірі</p>
          <p class="done-number" id="number"></p>
        </div>
        <p class="done-note">Мы позовём вас, когда заказ будет готов</p>
        <p class="kz done-note-kz">Тапсырыс дайын болғанда шақырамыз</p>
      </section>
    </main>
  </body>
</html>
