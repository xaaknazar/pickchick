appId: kz.pickchick.kitchen
productName: PickChick Kitchen
electronVersion: 44.2.0
asar: true
npmRebuild: false
nodeGypRebuild: false
directories:
  output: release
  buildResources: build
files:
  - main.mjs
  - security.mjs
  - gateway.mjs
  - renderer/index.html
  - renderer/styles.css
  - renderer/logo.png
  - renderer/bg-blue.png
  - renderer/app.js
  - renderer/api.js
  - renderer/model.js
  - renderer/runtime.js
  - renderer/types.js
  - renderer/fonts/*.woff2
  - renderer/asset-manifest.json
  - package.json
extraResources:
  - from: build/config.example.json
    to: config.example.json
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false
toolsets:
  wine: 1.0.1
  nsis: 1.2.1
  winCodeSign: 1.1.0
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: build/icon.png
  executableName: PickChickKitchen
  artifactName: PickChick-Kitchen-${version}-${arch}.${ext}
  requestedExecutionLevel: asInvoker
  forceCodeSigning: false
nsis:
  artifactName: PickChick-Kitchen-Setup-${version}-${arch}.${ext}
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: false
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: PickChick Kitchen
  installerLanguages: [ru_RU, en_US]
  packElevateHelper: false
portable:
  artifactName: PickChick-Kitchen-Portable-${version}-${arch}.${ext}
  requestExecutionLevel: user
mac:
  target: [dir]
  identity: null
  icon: build/icon.png
