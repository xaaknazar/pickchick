name: Desktop update feed server

on:
  push:
    branches: ['codex/**', 'claude/project-thread-ntdsta']
    paths:
      - 'infra/desktop-updates/**'
      - 'infra/roadmap/remote-deploy.py'
      - 'infra/public-staging/gateway.Caddyfile'
      - 'infra/public-staging/compose.yaml'
      - 'tests/desktop-update-server/**'
      - 'tests/operations/test_desktop_updates_release.py'
      - 'apps/pos-desktop/updater.mjs'
      - 'scripts/desktop-update-feed.mjs'
      - '.node-version'
      - '.github/workflows/desktop-updates-server.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-updates-server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rehearsal:
    name: Feed install, publish and withdraw behind the real gateway
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Rules of the server step without Docker (feed, route, rollback)
        run: python3 -m unittest tests/operations/test_desktop_updates_release.py
      - name: Rehearsal with Docker, the pinned gateway image and the updater of the programs
        run: python3 tests/desktop-update-server/server-rehearsal.py
