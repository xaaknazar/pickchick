name: Windows POS sync guards

on:
  push:
    branches: [main, 'codex/**']
    paths:
      - 'infra/windows/**'
      - 'tests/operations/windows-pos-sync.test.ps1'
      - '.github/workflows/windows-pos-sync.yml'
  pull_request:
    branches: [main]
    paths:
      - 'infra/windows/**'
      - 'tests/operations/windows-pos-sync.test.ps1'
      - '.github/workflows/windows-pos-sync.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-pos-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guards:
    name: POS sync parser and recovery on Windows PowerShell 5.1
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Check SSH pinning, service arguments and file recovery
        shell: powershell
        run: |
          if ($PSVersionTable.PSEdition -ne 'Desktop' -or $PSVersionTable.PSVersion.Major -ne 5 -or $PSVersionTable.PSVersion.Minor -ne 1) {
            throw 'Windows PowerShell 5.1 is required.'
          }
          & ./tests/operations/windows-pos-sync.test.ps1

# Tests extract pure functions and use disposable files. No live SCM/ACL or restaurant acceptance.
