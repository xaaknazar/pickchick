name: Windows POS package

on:
  push:
    branches: [main, 'codex/**']
    paths:
      - 'apps/pos/**'
      - 'apps/pos-desktop/**'
      - 'packages/contracts/**'
      - 'tests/pos-desktop/**'
      - 'tsconfig.base.json'
      - '.node-version'
      - '.github/workflows/windows-pos.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/pos/**'
      - 'apps/pos-desktop/**'
      - 'packages/contracts/**'
      - 'tests/pos-desktop/**'
      - 'tsconfig.base.json'
      - '.node-version'
      - '.github/workflows/windows-pos.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-pos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package installed Windows x64 POS
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/pos-desktop
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install pinned standalone package manager
        run: npm install --global npm@11.13.0
      - name: Install locked desktop toolchain
        run: npm ci
      - name: Typecheck renderer and desktop entry points
        run: npm run typecheck
      - name: Verify restricted local protocol and durable journal
        run: node --test ../../tests/pos-desktop/protocol.test.mjs ../../tests/pos-desktop/journal.test.mjs
      - name: Package clean source for Windows x64
        run: npm run dist:win
      - name: Verify packaged source, AMD64 executable and security fuses
        run: npm run verify:win
      - name: Record executable hashes
        shell: pwsh
        run: |
          Get-ChildItem release/ -Filter *.exe | Sort-Object Name | ForEach-Object {
            $digest = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$digest  $($_.Name)"
          } | Set-Content release/SHA256SUMS.txt -Encoding utf8NoBOM
      - name: Preserve unsigned pre-release packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pickchick-pos-windows-x64-${{ github.sha }}
          path: |
            apps/pos-desktop/release/PickChick-POS-Setup-*.exe
            apps/pos-desktop/release/PickChick-POS-Portable-*.exe
            apps/pos-desktop/release/SHA256SUMS.txt
            apps/pos-desktop/release/verification.json
            apps/pos-desktop/renderer/asset-manifest.json
          if-no-files-found: error
          retention-days: 14

# Packaging and protocol tests do not replace installation, real edge/PostgreSQL
# lifecycle tests, or physical Windows/terminal/KKM acceptance.
